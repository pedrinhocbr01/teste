# Ambiente de desenvolvimento do PDV
services:
  db:
    image: postgres:16-alpine
    container_name: pdv-db
    environment:
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: pdv
      POSTGRES_DB: pdv
    ports:
      - "5433:5432"
    volumes:
      - pdv-pgdata:/var/lib/postgresql/data
      # aplica schema+seed automaticamente num banco vazio:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv -d pdv"]
      interval: 5s
      timeout: 3s
      retries: 10

  api: # API NestJS — http://localhost:3001 (demo: /demo.html, KDS: /kds.html)
    build: ./apps/api
    container_name: pdv-api
    environment:
      DATABASE_URL: postgres://pdv:pdv@db:5432/pdv
      JWT_SECRET: ${JWT_SECRET:-troque-em-producao}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

  print-agent: # Fase 2 — consome a fila e imprime (virtual por padrão; MODO_IMPRESSAO=real na LAN)
    build: ./apps/print-agent
    container_name: pdv-print-agent
    environment:
      API_URL: http://api:3001
      AGENT_EMAIL: ${AGENT_EMAIL:-diego@casadofogo.com}
      AGENT_PIN: ${AGENT_PIN:-5555}
      MODO: ${MODO_IMPRESSAO:-virtual}
      POLL_MS: 3000
    volumes:
      - ./apps/print-agent/tickets:/app/tickets
    depends_on:
      api:
        condition: service_healthy

  adminer:  # UI web opcional p/ inspecionar o banco: http://localhost:8081 (servidor: db, user/senha: pdv)
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pdv-pgdata:
